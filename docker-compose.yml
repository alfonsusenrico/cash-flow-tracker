services:
  db:
    image: postgres:16
    container_name: ledger_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerpass}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ledger_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      labels: &project_image_labels
        # Deploy cleanup prunes only images carrying this label (scripts/deploy_remote_release.sh).
        cash-flow-tracker.managed: "true"
    container_name: ledger_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:-ledgerpass}@db:5432/${POSTGRES_DB:-ledger}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8090}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,127.0.0.1/32,::1/128}
      INVITE_CODE: ${INVITE_CODE}
      TZ: ${TZ:-Asia/Jakarta}
      SUMMARY_CACHE_TTL: ${SUMMARY_CACHE_TTL:-30}
      MONTH_SUMMARY_TTL: ${MONTH_SUMMARY_TTL:-60}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-300}
      LOGIN_USER_RATE_LIMIT: ${LOGIN_USER_RATE_LIMIT:-5}
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-5}
      REGISTER_RATE_WINDOW: ${REGISTER_RATE_WINDOW:-900}
      PASSWORD_MIN_LEN: ${PASSWORD_MIN_LEN:-8}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_MAX_WAITING: ${DB_POOL_MAX_WAITING:-100}
      PUBLIC_RATE_LIMIT: ${PUBLIC_RATE_LIMIT:-120}
      PUBLIC_RATE_WINDOW: ${PUBLIC_RATE_WINDOW:-60}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_PREFIX: ${REDIS_PREFIX:-cashflow}
      RECEIPTS_DIR: ${RECEIPTS_DIR:-/app/storage/receipts}
      RECEIPT_MAX_MB: ${RECEIPT_MAX_MB:-10}
      RECEIPT_WEBP_QUALITY: ${RECEIPT_WEBP_QUALITY:-75}
      RECEIPT_MAX_PIXELS: ${RECEIPT_MAX_PIXELS:-50000000}
      LEDGER_EXPORT_MAX_ROWS: ${LEDGER_EXPORT_MAX_ROWS:-5000}
      NOTIFICATION_AI_ENABLED: ${NOTIFICATION_AI_ENABLED:-false}
      NOTIFICATION_AI_MODEL: ${NOTIFICATION_AI_MODEL:-gpt-6-luna}
      NOTIFICATION_AI_REASONING_EFFORT: ${NOTIFICATION_AI_REASONING_EFFORT:-none}
      NOTIFICATION_AI_HISTORY_LIMIT: ${NOTIFICATION_AI_HISTORY_LIMIT:-20}
      NOTIFICATION_AI_TIMEOUT: ${NOTIFICATION_AI_TIMEOUT:-30}
      NOTIFICATION_PAIRING_WINDOW_SECONDS: ${NOTIFICATION_PAIRING_WINDOW_SECONDS:-900}
      NOTIFICATION_MAPPING_AUTO_THRESHOLD: ${NOTIFICATION_MAPPING_AUTO_THRESHOLD:-0.85}
      NOTIFICATION_REVIEW_CONFIDENCE_THRESHOLD: ${NOTIFICATION_REVIEW_CONFIDENCE_THRESHOLD:-0.8}
      MOVEMENT_TRANSFER_FEES: ${MOVEMENT_TRANSFER_FEES:-2500,6500,1000,2900}
      MOVEMENT_FEE_MAX_DIFFERENCE: ${MOVEMENT_FEE_MAX_DIFFERENCE:-10000}
      MOVEMENT_REPAIR_INTERVAL_SECONDS: ${MOVEMENT_REPAIR_INTERVAL_SECONDS:-600}
      MOVEMENT_REPAIR_LOOKBACK_HOURS: ${MOVEMENT_REPAIR_LOOKBACK_HOURS:-48}
      MOVEMENT_REPAIR_MAX_GAP_SECONDS: ${MOVEMENT_REPAIR_MAX_GAP_SECONDS:-21600}
      HISTORY_SUGGESTION_MAX_ROWS: ${HISTORY_SUGGESTION_MAX_ROWS:-300}
      HISTORY_SUGGESTION_BATCH_SIZE: ${HISTORY_SUGGESTION_BATCH_SIZE:-20}
      CAPTURE_CONFIDENCE_THRESHOLD: ${CAPTURE_CONFIDENCE_THRESHOLD:-0.8}
      PLAN_AUTO_LINK_ENABLED: ${PLAN_AUTO_LINK_ENABLED:-true}
      HABIT_AUTO_RECORD_ENABLED: ${HABIT_AUTO_RECORD_ENABLED:-true}
      POCKET_LEARNING_AUTO_RECORD_ENABLED: ${POCKET_LEARNING_AUTO_RECORD_ENABLED:-true}
      TOPUP_AUTO_RECORD_ENABLED: ${TOPUP_AUTO_RECORD_ENABLED:-true}
      PAIRING_SERVER_URL: ${PAIRING_SERVER_URL:-https://finance.alfonsusenrico.com}
      APP_ENV: ${APP_ENV:-production}
      NOTIFICATION_AI_DRY_RUN_ENABLED: ${NOTIFICATION_AI_DRY_RUN_ENABLED:-false}
      LLM_ENGLISH_OUTPUT_ENABLED: ${LLM_ENGLISH_OUTPUT_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - api_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      labels: *project_image_labels
    container_name: ledger_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      - api

  migrate:
    image: flyway/flyway:10
    container_name: ledger_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ledger}
      FLYWAY_USER: ${POSTGRES_USER:-ledger}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-ledgerpass}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    command: -connectRetries=60 migrate
    volumes:
      - ./db/migrations:/flyway/migrations:ro

  web:
    image: nginx:alpine
    container_name: ledger_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

  backup:
    # Production enables this profile in the deploy script; local stacks opt in with --profile backup.
    profiles: ["backup"]
    build:
      context: ./db/backup
      labels: *project_image_labels
    container_name: ledger_backup
    restart: unless-stopped
    # The deploy runs dumps as the host user that owns BACKUP_HOST_DIR, so that user can manage them.
    user: "${BACKUP_UID:-0}:${BACKUP_GID:-0}"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-ledger}
      PGUSER: ${POSTGRES_USER:-ledger}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ledgerpass}
      TZ: ${TZ:-Asia/Jakarta}
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # The deploy's free-space threshold; a backup that leaves less free space logs a warning.
      DEPLOY_MIN_FREE_GB: ${DEPLOY_MIN_FREE_GB:-5}
    volumes:
      # A host directory, outside every Docker volume, so dumps survive losing db_data.
      - ${BACKUP_HOST_DIR:-./storage/backups}:/backups
    healthcheck:
      test: ["CMD", "backup-healthcheck"]
      # Short enough that the deploy's `up --wait` sees the first check well within its timeout.
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  api_storage:
