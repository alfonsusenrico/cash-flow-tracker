name: Android checks

# Unsigned checks of the companion app in mobile/. The release workflow calls this on the tagged
# commit, so a release refuses a commit whose checks did not pass.
on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-ci.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Unit tests, lint and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/*.gradle.kts
            mobile/app/*.gradle.kts
            mobile/gradle/wrapper/gradle-wrapper.properties

      # Separate invocations: one Gradle run with every task has exhausted memory before.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Unit test results
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/junit_summary.py app/build/test-results/testDebugUnitTest --summary "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug

      - name: Keep reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            mobile/app/build/test-results/testDebugUnitTest/
            mobile/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
